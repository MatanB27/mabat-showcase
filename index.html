<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5c744"><title>מבט | סיורים תלת־ממדיים לנכסים</title><meta name="description" content="היכנסו לסיור בדירה לדוגמה והשאירו פרטים כדי ליצור סיור לנכס שלכם."><link rel="stylesheet" href="site.css?v=2"></head>
<body><header><a href="./" class="brand" aria-label="מבט, דף הבית"><i aria-hidden="true"></i>מבט</a><a href="#contact">דברו איתנו ↙</a></header>
<main><section class="hero"><div class="intro"><h1>להיכנס לנכס<br>מכל מקום.</h1><p>סיור תלת־ממדי שאפשר לשלוח בקישור. האורחים והקונים שלכם יכולים להסתובב בנכס ולהכיר אותו עוד לפני הביקור.</p><a class="primary" href="#contact">אני רוצה סיור לנכס שלי <b aria-hidden="true">←</b></a></div>
<figure id="showcase"><div class="stage"><img src="cover.webp" alt="מבט מלמעלה על הדירה לדוגמה, עם הסלון, המטבח והחדרים" width="960" height="800"><button id="openTour" type="button">כניסה לסיור בדירה ←</button></div><figcaption><strong>הדירה לדוגמה</strong><span>מבט מתוך המודל</span></figcaption></figure></section>
<section id="contact"><div><h2>נכין סיור גם<br>לנכס שלכם?</h2><p>השאירו שם ומייל ונחזור אליכם עם הפרטים.</p></div><form><label for="name">שם מלא</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80"><label for="email">אימייל</label><input dir="ltr" type="email" id="email" name="email" autocomplete="email" required maxlength="254"><label for="note">מה תרצו להציג? <small>(רשות)</small></label><textarea id="note" name="note" maxlength="600" rows="2" placeholder="למשל, צימר עם חצר או דירה למכירה"></textarea><button class="primary" id="submit">שליחת פרטים <b aria-hidden="true">←</b></button><p id="status" role="status"></p></form></section></main>
